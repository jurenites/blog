resolver 127.0.0.11 valid=10s;
server {
  listen 80;
  server_name _;
  client_max_body_size 1500k;
  access_log off;
  location /api/dream-desires/v1/ {
    set $drupal_upstream web:80;
    proxy_pass http://$drupal_upstream;
    proxy_set_header Host jurenites.local;
    proxy_set_header X-Forwarded-Proto http;
    proxy_read_timeout 30s;
  }
  location / { return 404; }
}
