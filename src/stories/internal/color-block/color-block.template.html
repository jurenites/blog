<div class="color-block color-block--{{chip_size}}">
  <span class="color-block__chip {{background_class}} {{foreground_class}}" aria-hidden="true">
    <span class="color-block__chip-text">{{chip_text}}</span>
  </span>
  <span class="color-block__information">
    <span class="color-block__primary">{{primary_text}}</span>
    <code class="color-block__secondary">{{secondary_text}}</code>
    <code class="color-block__tertiary">{{tertiary_text}}</code>
  </span>
</div>
