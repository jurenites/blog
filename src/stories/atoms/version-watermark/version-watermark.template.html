<div class="storybook-shell">
  <div class="version-watermark">
    <span class="version-watermark__identity">
      <span class="version-watermark__label">{{version_label}}</span>
      <span class="version-watermark__number">{{version_number}}</span>
      <span class="version-watermark__separator" aria-hidden="true">·</span>
      <a class="version-git-hash" href="{{git_url}}" target="_blank" rel="noopener noreferrer">{{git_hash}}</a>
    </span>
    <span class="version-watermark__credit">{{credit_text}}</span>
  </div>
</div>
