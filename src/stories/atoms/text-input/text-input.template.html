<div class="text-input text-input--width-{{input_width}}">
  <label class="text-input__label" for="{{input_id}}">{{input_label}}</label>
  <input class="text-input__control" id="{{input_id}}" name="{{input_name}}" type="{{input_type}}" value="{{input_value}}" placeholder="{{input_placeholder}}"{{required_attribute}} aria-describedby="{{hint_id}}">
  {{input_action}}
  <p class="text-input__hint" id="{{hint_id}}">{{hint_text}}</p>
</div>
