<article class="guideline-tile guideline-tile--{{preview_kind}}">
  <a class="guideline-tile__link" href="{{guideline_url}}">
    <span class="guideline-tile__visual" aria-hidden="true">{{preview_content}}</span>
    <span class="guideline-tile__body">
      <span class="guideline-tile__eyebrow">Guideline</span>
      <span class="guideline-tile__title">{{guideline_title}}</span>
      <span class="guideline-tile__summary"><p>{{guideline_summary}}</p></span>
    </span>
  </a>
</article>
