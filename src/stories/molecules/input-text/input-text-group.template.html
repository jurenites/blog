<fieldset class="input-text input-text--group{{input_text_classes}}" data-field-data-type="{{field_data_type}}"{{fieldset_attributes}}>
  <legend class="input-text__label">{{field_label_text}}{{required_markup}}</legend>
  <div class="input-text__choices input-text__choices--{{choice_layout}}">
    {{field_control_markup}}
  </div>
  {{field_description_markup}}
  {{field_error_markup}}
</fieldset>
