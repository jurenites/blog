<article class="article-list-item">
  <div class="article-list-item__media">
    <a class="article-list-item__image-link" href="{{article_url}}">
      <img src="{{thumbnail_url}}" alt="{{thumbnail_alt}}">
    </a>
  </div>
  <div class="article-list-item__body">
    <h2 class="article-list-item__title">
      <a class="article-list-item__title-link" href="{{article_url}}">{{teaser_title}}</a>
    </h2>
    <div class="article-list-item__content">{{teaser_excerpt}}</div>
    <div class="article-list-item__meta">
      {{author_byline_content}}
    </div>
  </div>
</article>
