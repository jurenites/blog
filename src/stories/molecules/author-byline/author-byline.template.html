<div class="storybook-stack storybook-stack--wide">
  <aside class="author-byline" aria-label="Article author">
    {{avatar_content}}
    <div class="author-byline__identity">
      <p class="author-byline__name">{{author_name}}</p>
      <div class="author-byline__details">
        {{published_date}}
        <span class="author-byline__separator" aria-hidden="true">&middot;</span>
        {{reading_time}}
      </div>
    </div>
    <div class="author-byline__topics">{{topic_items}}</div>
  </aside>
</div>
