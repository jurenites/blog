<div class="storybook-stack storybook-stack--wide">
  <aside class="author-byline" aria-label="{{byline_label}}">
    {{avatar_content}}
    <div class="author-byline__identity">
      <span class="author-byline__name">{{author_name_markup}}</span>
      <span class="author-byline__details">
        {{published_date}}
        {{reading_time_content}}
      </span>
    </div>
    {{topic_content}}
  </aside>
</div>
