<figure class="media-loader" aria-busy="true">
  <div class="media-loader__noise" data-jurenites-media-loader-noise aria-hidden="true"></div>
  <figcaption class="media-loader__status">
    <progress
      class="media-loader__progress"
      max="100"
      value="0"
      aria-label="{{progress_label}}"
    ></progress>
  </figcaption>
</figure>
