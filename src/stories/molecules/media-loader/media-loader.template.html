<figure class="media-loader {{loader_class}}" aria-busy="true">
  {{loading_surface}}
  {{media_content}}
  <figcaption class="media-loader__status">
    <progress
      class="media-loader__progress"
      max="100"
      value="0"
      aria-label="{{progress_label}}"
    ></progress>
  </figcaption>
</figure>
