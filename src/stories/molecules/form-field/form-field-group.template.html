<fieldset class="form-field form-field--group{{form_field_classes}}" data-field-data-type="{{field_data_type}}"{{fieldset_attributes}}>
  <legend class="form-field__label">{{field_label_text}}{{required_markup}}</legend>
  <div class="form-field__choices form-field__choices--{{choice_layout}}">
    {{field_control_markup}}
  </div>
  {{field_description_markup}}
  {{field_error_markup}}
</fieldset>
