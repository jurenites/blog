<li class="footer-navigation__item">
  <a class="footer-navigation__link footer-navigation__social-link" href="{{link_url}}" data-social-icon="{{icon_name}}" target="_blank" rel="me noopener noreferrer" aria-label="{{link_accessible_label}}">
    {{social_icon_markup}}
    <span class="footer-navigation__social-label" aria-hidden="true">
      <span class="footer-navigation__social-label-text footer-navigation__social-label-text--default">{{link_label}}</span>
      <span class="footer-navigation__social-label-text footer-navigation__social-label-text--hover">
        <span>{{hover_label}}</span>
        {{external_icon_markup}}
      </span>
    </span>
  </a>
</li>
