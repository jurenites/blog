<section class="timeline__year-group timeline__year-group--month-count-{{visible_month_count}}" aria-labelledby="timeline-year-{{year_label}}">
  <h2 id="timeline-year-{{year_label}}" class="timeline__year-heading">{{year_label}}</h2>
  <div class="timeline__year-canvas">
    <ol class="timeline__months" aria-hidden="true">{{timeline_months_markup}}</ol>
    <ol class="timeline__items" aria-label="Project durations">{{timeline_items_markup}}</ol>
    <ol class="timeline__year-details">{{timeline_details_markup}}</ol>
  </div>
</section>
