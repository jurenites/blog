<main class="storybook-shell">
  <article class="timeline">
    <header class="timeline__header">
      <h1>{{timeline_heading}}</h1>
      <div class="timeline__introduction"><p>{{timeline_introduction}}</p></div>
      <p class="timeline__count">{{timeline_item_count}} {{timeline_count_label}}</p>
    </header>
    <div class="timeline__years">
      {{timeline_organization_sticky_markup}}
      {{timeline_years_markup}}
    </div>
  </article>
</main>
