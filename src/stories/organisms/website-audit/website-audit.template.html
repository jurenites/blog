<section class="website-audit">
  <div class="website-audit__report">
    <h2>{{section_heading}}</h2>
    <p>{{report_description}}</p>
    <h3>{{report_heading}}</h3>
    <ul>{{report_items}}</ul>
  </div>
  <div class="website-audit__offer">
    <div class="website-audit__offer-copy">
      <h3>{{offer_heading}}</h3>
      <p>{{offer_description}}</p>
    </div>
    <p class="website-audit__turnaround">{{turnaround_label}}
      <time class="website-audit__duration" datetime="P{{business_days}}D">{{business_days}} business days</time>
    </p>
    {{order_button}}
  </div>
</section>
