<div class="storybook-stack storybook-stack--wide">
  <aside class="newsletter-signup" aria-labelledby="newsletter-title">
    <div class="newsletter-signup__copy">
      <p class="newsletter-signup__eyebrow">{{eyebrow_heading}}</p>
      <h2 class="newsletter-signup__title" id="newsletter-title">{{signup_title}}</h2>
      <p class="newsletter-signup__description">{{signup_description}}</p>
    </div>
    <form class="newsletter-signup__form" action="{{form_action}}">
      <div class="newsletter-signup__field">
        {{email_field}}
      </div>
      <p class="newsletter-signup__privacy">{{privacy_note}}</p>
    </form>
  </aside>
</div>
