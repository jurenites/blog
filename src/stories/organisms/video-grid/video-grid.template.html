<section aria-label="Videos" data-video-listing>
  <p class="video-grid__introduction">{{introduction_text}}</p>
  <div class="video-grid">{{video_items_markup}}</div>
  <p class="video-grid__status" data-video-status role="status" aria-live="polite" aria-atomic="true" hidden
    data-loading-text="Loading more videos…"
    data-loaded-text="More videos loaded."
    data-complete-text="All videos loaded."
    data-error-text="Could not load more videos. Use the pagination below to continue."></p>
  <div data-video-pager>{{pagination_markup}}</div>
</section>
