<section class="pixel-glyph-editor" data-jurenites-pixel-glyph-editor aria-labelledby="{{component_id}}-title">
  <header class="pixel-glyph-editor__header">
    <p class="pixel-glyph-editor__eyebrow">Interactive grid</p>
    <h2 id="{{component_id}}-title">Draw a 5×5 glyph</h2>
    <p>Click, tap, use Space or Enter, or drag across cells. Reloading starts from a blank grid.</p>
  </header>
  <div class="pixel-glyph-editor__workspace">
    <div class="pixel-glyph-editor__controls">
      <div class="pixel-glyph-editor__grid" role="group" aria-label="5 by 5 pixel drawing grid">
        {{cell_buttons}}
      </div>
      <p class="pixel-glyph-editor__status" data-pixel-status role="status">0 of 25 pixels filled</p>
    </div>
    <div class="pixel-glyph-editor__preview-block">
      <h3>Preview</h3>
      <div class="pixel-glyph-editor__preview" aria-label="Enlarged glyph preview">
        {{preview_cells}}
      </div>
    </div>
  </div>
</section>
