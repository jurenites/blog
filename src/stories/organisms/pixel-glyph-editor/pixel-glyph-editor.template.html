<section class="pixel-glyph-editor" data-jurenites-pixel-glyph-editor aria-labelledby="{{component_id}}-title">
  <header class="pixel-glyph-editor__header">
    <!--<p class="pixel-glyph-editor__eyebrow">Interactive grid</p> -->
    <h2 id="{{component_id}}-title">{{editor_heading}}</h2>
    <p>{{editor_instructions}}</p>
  </header>
  <div class="pixel-glyph-editor__workspace">
    <div class="pixel-glyph-editor__grid" role="group" aria-label="{{grid_accessible_label}}">
      {{cell_buttons}}
    </div>
    <div class="font-preview__glyph-tile pixel-glyph-editor__glyph-preview" aria-hidden="true">
      <span class="pixel-glyph-editor__glyph-preview-grid">
        {{preview_cells}}
      </span>
    </div>
  </div>
</section>
