<div class="content-layout content-layout--{{content_width}}{{sidebar_class_name}}">
  <main class="content-layout__main">
    <header class="content-layout__header">
      <p class="content-layout__eyebrow">{{eyebrow_heading}}</p>
      <h1 class="content-layout__title">{{page_heading}}</h1>
      <p class="content-layout__introduction">{{introductory_text}}</p>
    </header>
    <div class="content-layout__body">
      <p>{{primary_paragraph}}</p>
      <h2>{{section_heading}}</h2>
      <p>{{secondary_paragraph}}</p>
    </div>
  </main>
  {{sidebar_markup}}
</div>
