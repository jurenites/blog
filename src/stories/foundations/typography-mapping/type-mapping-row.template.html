<section class="type-mapping__row">
  <div class="type-mapping__identity">
    <strong class="type-mapping__name">{{role_name}}</strong>
    <code class="type-mapping__token">{{token_name}}</code>
  </div>
  <p class="type-mapping__sample {{sample_class}}">{{sample_text}}</p>
  <dl class="type-mapping__details">
    <div><dt>Font shorthand</dt><dd>{{font_shorthand}}</dd></div>
  </dl>
</section>
