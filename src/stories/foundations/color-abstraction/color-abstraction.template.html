<main class="color-levels">
  <section class="color-level">
    <h2 class="color-level__heading">1. Palette</h2>
    <ul class="color-token-list">
      {{palette_colors}}
    </ul>
  </section>
  <section class="color-level">
    <h2 class="color-level__heading">2. Theme → Palette</h2>
    <ul class="color-token-list">
      {{theme_colors}}
    </ul>
  </section>
  <section class="color-level">
    <h2 class="color-level__heading">3. Component Mappings</h2>
    <ul class="color-token-list">
      {{component_colors}}
    </ul>
  </section>
</main>
