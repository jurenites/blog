component.game-of-life.example-columns-default: 5 # Standalone canvas defaults; data-user selects the authored dimensions.
component.game-of-life.example-rows-default: 5
component.game-of-life.example-size-default: 1 # Integer zoom scales cell footprints, live squares, and shared borders together.
component.site-header.brand-name-letter-spacing-start: -2px # Added letters begin slightly compressed before reaching normal spacing.
component.button.default-style: primary
component.button.style.primary: fill # Filled action button.
component.button.style.secondary: outline # Outlined action button.
component.button.style.ghost: inline # Text-only action button.
component.text-input.default-width: full
component.content-layout.default-width: readable
component.badge.default-variant: neutral
component.tooltip.default-variant: full-black
component.avatar.default-size: medium
component.surface.default-variant: default
component.date-time-value.default-kind: absolute-date
component.date-time-value.default-date-display: date-day
component.date-time-value.locale-default: en-US
component.date-time-value.format.date-day.month: short
component.date-time-value.format.date-day.day: numeric
component.date-time-value.format.date-day.year: numeric
component.date-time-value.format.date-month.month: short
component.date-time-value.format.date-month.year: numeric
component.date-time-value.format.date-day-time.month: long
component.date-time-value.format.date-day-time.day: numeric
component.date-time-value.format.date-day-time.year: numeric
component.date-time-value.format.date-day-time.hour: numeric
