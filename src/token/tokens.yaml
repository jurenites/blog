component.website-audit.background-color: color.palette.dark-black
component.contact-photo.background-color: component.hero-section.background-edge-color
component.site-header.backdrop-color-default: "#00020780" # Half-opacity homepage tint matching the photograph edge.
component.hero-section.background-edge-color: "#000207" # Sampled from the outer edge of the Hero image for a continuous canvas.
component.hero-section.clear-color: "#00000000" # Transparent edges of the photographic lighting layer.
component.hero-section.ray-fill-color: "#68CBE812" # Faint cool light confined to the screen's emitting side.
component.hero-section.ray-highlight-color: "#8DDBF222" # Soft beam ridges; no lighting overlays on skin or clothing.
component.hero-section.ray-color-duration-default: 2800ms # Slow color changes evoke moving screen content without flashing.
component.input-text.color.validation-error-default: theme.dark.system.error-accent
component.watermark.color.identity-default: color.palette.full-white
component.watermark.color.credit-default: color.palette.light-gray
component.badge.color.background-neutral-default: color.palette.light-black
