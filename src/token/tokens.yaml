# Editable source of truth for design tokens.
# Each token is one direct key/value pair. Run npm run build:tokens after changes.
meta:
  project: blog-jurenites
  status: draft
  sourceWorkflow: "product purpose -> roles and concepts -> grayscale exploration -> forms and glossary -> tokens -> Figma -> Storybook -> documentation and backlog -> Drupal with real data -> verification, with feedback to affected decisions"
  sourceOfTruth: "src/token/tokens.yaml is the editable single source of truth. Generated SCSS/CSS outputs and Figma variables are derived from it."
  typographyBasis: "Typography roles are concise CSS font shorthand values reused by components."
  colorRule: "Colors are HEX only. Never use the CSS opacity property; alpha is expressed as 8-digit HEX (for example shadow colors) so composited colors stay predictable."
  note: "This file is a concise data contract, not a code module. Add a token only when a real consumer needs the design decision."
system:
  icon:
    default-svg-viewport: 24px # Small icons sit inside a 24 by 24 SVG viewport.
  breakpoint:
    mobile-min: 360px # Smallest supported viewport. Do not design below this width.
    mobile-max: 640px # Upper bound of the mobile range.
    tablet-min: 641px # Lower bound of the tablet range.
    tablet-max: 1279px # Upper bound of the tablet range.
    desktop-min: 1280px # Lower bound of the desktop range and the primary design width.
    desktop-max: 1920px # Maximum tested desktop viewport. Wider screens keep desktop behavior and show additional page background outside centered content.
    site-header-inline-min: 1440px # Visible navigation moves to a second row below this width; the compact menu starts at mobile-max.
    article-sidebar-min: 1184px # Centered 800px Body + two equal side tracks, each with a 32px gap and 160px minimum width.
    content-gutter-max: 1008px # 960px wide content plus 24px of space on each side.
  naming:
    separator: "-" # Flattened token names use dash-separated namespaces.
    pattern: "{layer}-{scope}-{part}-{property}-{state}" # Use the shortest complete name. Each token must be descriptive and multi-part. Never use a lone generic word (invalid: orange, size, card).
    examples: "component-input-text-color-validation-error-default, theme-dark-surface-background-page, theme-dark-action-primary-default"
color:
  palette:
    full-black: "#000000"
    dark-black: "#020618"
    black: "#0F172B"
    light-black: "#1D293D"
    deep-gray: "#314158"
    dark-gray: "#45556C"
    gray: "#62748E"
    light-gray: "#90A1B9"
    pale-gray: "#CAD5E2"
    dark-white: "#E2E8F0"
    light-white: "#F1F5F9"
    white: "#F8FAFC"
    full-white: "#FFFFFF"
    brand-primary-accent: "#F1F5F9" # "#44BBBB" # Dark cyan
    brand-primary: "#66FFFF" # Cyan
    brand-primary-soft: "#AAFFFF" # Light cyan
    brand-secondary-accent: "#BB44BB" # Dark magenta
    brand-secondary: "#FF66FF" # Magenta
    brand-secondary-soft: "#FFAAFF" # Light magenta
    brand-tertiary-accent: "#C8C844" # Dark yellow
    brand-tertiary: "#FFFF66" # Yellow
    brand-tertiary-soft: "#FFFFAA" # Light yellow
    # Bright RGB system ramps share the CMY brand's 44/BB, 66/FF and AA/FF levels.
    system-success-accent: "#44BB44" # Strong green
    system-success: "#66FF66" # Bright green
    system-success-soft: "#AAFFAA" # Light green
    system-error-accent: "#BB4444" # Strong red
    system-error: "#FF6666" # Bright red
    system-error-soft: "#FFAAAA" # Light red
    system-warning-accent: "#FFD5AA" # Light orange; retained light-accent role
    system-warning: "#FFB366" # Bright orange
    system-warning-strong: "#BB8044" # Strong orange
theme:
  dark:
    surface:
      background-page: color.palette.dark-black
      background-elevation-level-0: color.palette.black
      background-elevation-level-1: color.palette.light-black
      background-elevation-level-2: color.palette.deep-gray
    text:
      primary-default: color.palette.white
      secondary-default: color.palette.light-white
      light: color.palette.light-white
      gray: color.palette.gray
      inverse-default: color.palette.full-black
      error-default: color.palette.system-error-accent
    action:
      primary-default: color.palette.brand-tertiary
      primary-hover: color.palette.brand-tertiary-accent
      secondary-default: color.palette.black
      secondary-hover: color.palette.dark-gray
    border:
      outline-default: color.palette.dark-gray
      divider-default: color.palette.gray
    system:
      success-accent: color.palette.system-success-accent
      success: color.palette.system-success
      success-soft: color.palette.system-success-soft
      error-accent: color.palette.system-error-accent
      error: color.palette.system-error
      error-soft: color.palette.system-error-soft
      warning-accent: color.palette.system-warning-accent
      warning: color.palette.system-warning
      warning-strong: color.palette.system-warning-strong
typography:
  font-family:
    sans: ["Open Sans", "Helvetica Neue", Arial, sans-serif] # Base UI/body family.
    number: ["Ubuntu Sans Mono", monospace] # Humanist monospace family for machine-readable text and numbers.
    roundabout: [Roundabout, "Open Sans", sans-serif] # Demonstration-only custom font; never use for website headings or UI.
    4pixel: [4pixel, monospace] # Demonstration and compact technical-detail font.
  # Explicit line boxes follow the 8px grid; never rely on the font's normal line height.
  headline-1: '100 96px/112px var(--typography-font-family-sans)' # <h1>
  headline-2: '100 64px/80px var(--typography-font-family-sans)' # <h2>
  headline-3: '100 40px/48px var(--typography-font-family-sans)' # <h3>
  headline-4: '100 32px/40px var(--typography-font-family-sans)' # <h4>
  headline-5: '24px/32px var(--typography-font-family-sans)' # <h5>
  headline-6: '20px/24px var(--typography-font-family-sans)' # <h6>; Open Sans Light below 24px.
  subtitle-1: '16px/24px var(--typography-font-family-sans)'
  subtitle-2: '14px/16px var(--typography-font-family-sans)'
  eyebrow: '14px/16px var(--typography-font-family-sans)'
  body: '300 16px/24px var(--typography-font-family-sans)'
  body-2: '14px/16px var(--typography-font-family-sans)' # Compact supporting copy in cards and dense UI; full article body remains on body.
  link: '300 16px/24px var(--typography-font-family-sans)' # Components add the required underline separately.
  caption: '14px/16px var(--typography-font-family-sans)'
  badge: '500 12px/16px var(--typography-font-family-sans)'

  numeric-display: '64px/80px var(--typography-font-family-number)' # Large statistics and other prominent numeric values.
  machine-readable: '14px/16px var(--typography-font-family-number)' # Compact system values and identifiers in the Ubuntu Sans Mono family.

  overline: '5px/8px var(--typography-font-family-4pixel)' # Demonstrations and compact technical details such as the version watermark.
space:
  scale:
    zero: 0px
    one: 1px # Intentional sub-grid exception for lines and dividers.
    two: 2px # Intentional sub-grid exception for optical adjustments.
    base-gap: 8px # Multiply this grid unit with CSS calc() for every larger size.
shape:
  icon-viewport: 24px;
  basic-tile: 40px;
  corner-radius:
    none: 0px
    small: 0px # Square-corner visual language; semantic names remain stable for consumers.
    base: 0px
    full: 0px
  border-width:
    hairline-default: 1px
    thick-default: 1px
# TODO this 'elevation' shpuld be moved into a theme.dark.elecation-level-0.shadow and theme.dark.elecation-level-0.backgropund-color we need to reaorganise the token mentioned palces
elevation:
  shadow:
    level-0: "0px 0px 0px 0px #00000000"
    level-1: "0px 1px 3px 0px #0000002E"
    level-2: "0px 2px 6px 0px #00000033"
    level-3: "0px 4px 12px 0px #0000003D"
    level-4: "0px 8px 20px 0px #00000047"
    level-6: "0px 12px 32px 0px #0000005C"
motion:
  duration:
    instant-default: 0ms
    short-default: 150ms
    media-reveal-default: 200ms
    medium-default: 250ms
    long-default: 375ms
    extra-long: 500ms
  easing:
    standard-default: [0.4, 0, 0.2, 1] # Material standard curve.
    decelerate-default: [0, 0, 0.2, 1]
    accelerate-default: [0.4, 0, 1, 1]
    sharp-default: [0.4, 0, 0.6, 1]
    pulse-default: [0.1, 0.5, 0.6, 1] # Expanding radius accelerates gently before fading away.
    underline-reveal-default: [0.19, 1, 0.22, 1] # Fast entry followed by a gentle settling underline.
layout:
  container-max:
    tablet-default: 640px
    desktop-default: 1440px # Maximum centered content width for desktop and larger screens.
  content-max:
    blog-default: 800px # Blog listing frame for article teasers and pagination.
    wide-default: 960px # Wider frame for content that needs more horizontal room.
    timeline-default: 1280px # Timeline frame for dense chronology text and project details.
  gutter:
    mobile-default: 16px
    tablet-default: 24px
    desktop-default: 32px
component:
  call-to-action:
    background-color: color.palette.dark-black
    heading-size-min: 24px
    heading-size-max: 96px
    heading-letter-spacing: normal
    heading-line-height: 1.05
  website-audit:
    background-color: color.palette.dark-black
  status:
    indicator-size-default: 8px # Static test-status light.
    preview-height-default: 480px # Expandable local Storybook preview.
  game-of-life:
    counter-digit-width-default: 5px # Fixed advance for every 4pixel Overline digit, including the narrower 1.
    cell-size-default: 8px # Outer cell size; adjacent cells share their one pixel border.
    live-size-default: 4px # Centered living square inside each cell.
    border-size-default: 1px
    control-size-default: 32px # Compact, icon-only pause/play control.
    example-columns-default: 5 # Standalone canvas defaults; data-user selects the authored dimensions.
    example-rows-default: 5
    example-size-default: 1 # Integer zoom scales cell footprints, live squares, and shared borders together.
  contact-photo:
    max-width-default: 1600px # Independent of the readable Contact form width.
    edge-fade-width-default: 100px # Fade every edge; capped proportionally on small images.
    background-color: component.hero-section.background-edge-color
  site-header:
    link-underline-duration-default: 900ms # Matches the reference menu's enter and leave timing.
    backdrop-color-default: "#00020780" # Half-opacity homepage tint matching the photograph edge.
    backdrop-blur-default: 12px # Soften image details beneath navigation.
    backdrop-fade-height-default: 32px # Feather below the menu without affecting layout.
    brand-name-compact-width-default: 48px # Minimum inline space for the separate A and I initials.
    brand-name-font-weight-default: 300 # Lighter exception for the interactive header identity.
    brand-name-letter-font-size-start: 32px # Added letters grow into the headline role.
    brand-name-letter-spacing-start: -2px # Added letters begin slightly compressed before reaching normal spacing.
    brand-name-reveal-duration-default: 325ms # Each letter reveals and closes at twice the original speed.
    brand-name-reveal-stagger-default: 25ms # Consecutive letters expand at twice the original speed.
    brand-name-hold-duration-default: 2000ms # Hold after the full reveal completes and hover or focus leaves.
  guideline:
    tile-min-width-default: 280px # Overview tiles remain readable before the responsive grid adds another column.
    preview-height-default: 240px # Shared media field for Logo Icon, Color, and future guideline previews.
    logo-icon-size-default: 96px # Prominent specimen size for the standalone Logo Icon guideline.
    specimen-height-default: 320px # Allows the source icon and its clear space to remain visible on both comparison surfaces.
    swatch-min-width-default: 200px # Keeps token names readable without forcing a fixed column count.
    swatch-height-default: 120px # Color sample height used by both Drupal and the matching Storybook story.
  layered-scene:
    arrival-duration-default: 1100ms # One calm foreground entrance after the scene becomes visible.
    arrival-delay-default: 450ms # Brief empty-desk pause; never delays page content.
  # About-page technology profile: decimal confidence and responsive card spacing.
  skills-profile:
    padding-compact-default: 24px
    padding-header-default: 48px
    padding-item-default: 40px
    score-size-compact-default: 32px
    score-size-default: 44px

  hero-section:
    background-edge-color: "#000207" # Sampled from the outer edge of the Hero image for a continuous canvas.
    clear-color: "#00000000" # Transparent edges of the photographic lighting layer.
    ray-fill-color: "#68CBE812" # Faint cool light confined to the screen's emitting side.
    ray-highlight-color: "#8DDBF222" # Soft beam ridges; no lighting overlays on skin or clothing.
    ray-softness-default: 12px # Feather the beam perimeter before clipping at the screen edge.
    ray-color-duration-default: 2800ms # Slow color changes evoke moving screen content without flashing.
    image-edge-fade-width-default: 100px # Blend every image edge into its matching page canvas; capped on small images.
  message-toast:
    width-default: 420px # Readable notifications on wide screens.
    top-offset-default: 112px # Clear the frontend navigation and its backdrop.
    layer-default: 10001 # Above the header and content.
  cookie-policy-notice:
    layer-default: 9000 # Fixed footer notice sits above page content and below the build watermark and tooltips.
  article-teaser:
    grid-card-min-width-default: 240px # Smallest card width before the responsive grid adds another column.
    list-media-min-width-default: 180px # Lower bound for list-item media beside its text content.
    list-media-max-width-default: 280px # Upper bound for list-item media beside its text content.
    shadow-hover-default: "0px 1px 3px 0px #0000001A, 0px 4px 6px -1px #0000001A" # Square card hover shadow adapted from the Blog 47 reference.
  news-list-item:
    media-width-default: 160px # News stays denser than the standard Article list item.
    media-width-compact: 120px # Keep the thumbnail left-aligned without crowding compact layouts.
  chip:
    corner-radius-default: 9999px # Pill shape owned by Chip without changing the site's square global radius tokens.
  input-text:
    color:
      validation-error-default: theme.dark.system.error-accent
  site-branding:
    logo-size-default: 64px # Maximum rendered width and height of the site logo.
  watermark:
    color:
      identity-default: color.palette.full-white
      credit-default: color.palette.light-gray
    layer-default: 10000 # Keeps the non-interactive watermark above application content.
  button:
    default-style: primary
    label-text-transform-default: uppercase # Uppercase treatment owned exclusively by the Button atom.
    style:
      primary: fill # Filled action button.
      secondary: outline # Outlined action button.
      ghost: inline # Text-only action button.
  text-input:
    default-width: full
    minimum-width-default: component.text-input.width.quarter # Text inputs never shrink below the quarter-width option.
    width:
      full: 400px # Default maximum width for a standalone text input.
      half: 200px # Half of the default text input width.
      quarter: 80px # Quarter of the default width and the minimum supported text input width.
  font-preview:
    preview-character-size-default: 16px # Keeps custom-font input text and glyph previews aligned to their intended pixel grid.
  content-layout:
    default-width: readable
    sidebar-min-width-default: 240px
    sidebar-max-width-default: 320px
  article-table-of-content:
    sidebar-min-width-default: 160px # Contents may narrow before the Body column needs to stack.
  badge:
    color:
      background-neutral-default: color.palette.light-black
      foreground-neutral-default: color.palette.white
      background-gray-default: color.palette.gray
      foreground-gray-default: color.palette.white
      background-white-default: color.palette.white
      foreground-white-default: color.palette.full-black
    default-variant: neutral
  tooltip:
    color:
      background-full-black-default: color.palette.full-black
      background-black-default: color.palette.black
      background-light-black-default: color.palette.light-black
      foreground-default: color.palette.white
    default-variant: full-black
    layer-default: 11000 # Tooltip overlays sit above page UI and the 10000-layer build watermark.
  avatar:
    corner-radius-default: 9999px # Circular crop owned by Avatar without changing the site's square global radius tokens.
    default-size: medium
  comment-message:
    color:
      background-default: color.palette.full-white
      foreground-default: color.palette.full-black
    corner-radius-default: 20px # Soft chat-bubble geometry is intentionally scoped away from the square global surface language.
  surface:
    default-variant: default
  date-time-value:
    default-kind: absolute-date
    default-date-display: date-day
    locale-default: en-US
    format:
      date-day:
        month: short
        day: numeric
        year: numeric
      date-month:
        month: short
        year: numeric
      date-day-time:
        month: long
        day: numeric
        year: numeric
        hour: numeric
        minute: 2-digit
  timeline:
    marker-color-active: color.palette.full-white # Keyboard focus outline for project markers and cards.
    marker-size-default: space.scale.base-gap # Calendar lane width; markers have a wider hit area and hairline artwork.
    marker-size-active: 40px
    line-width-default: shape.border-width.hairline-default # Quiet continuous chronology rail.
    month-height-default: 32px # Every calendar year is twelve identical month tracks.
    sticky-layer-default: 20 # Keeps the active year above timeline records while its section is in view.
  media-loader:
    progress-height-default: 1px # Intentional exception to the x8 grid because this is a loading indicator line, not layout spacing.
  progressive-image:
    skeleton-cycle-default: 1600ms # Slow enough to read as loading state rather than decorative motion.
  crossfade-dot:
    marker-size-default: 4px # Visible marker inside the larger interactive target.
  pulse-indicator:
    container-size-default: 16px # Matches footer prefix sizing; the animated radius may extend beyond it.
    marker-size-default: 8px # Shared resting diameter for the central dot and animated radius.
    radius-scale-expanded: 4 # Expands the radius to a diameter.
    animation-duration-default: 3000ms # Calm repeating pulse adapted from the visual reference.
    dot-color-default: color.palette.full-white
    radius-color-start: "#FFFFFF40" # quater white at the start of each pulse.
    radius-color-end: "#FFFFFF00" # Fully transparent at maximum diameter and during reset.
  newsletter-signup:
    form-min-width-default: 280px
  numeric-values:
    tile-min-width-default: 240px
    tile-min-height-default: 200px
    icon-max-width-default: 80px # Preserve smaller intrinsic SVG dimensions while preventing oversized uploads.
    number-font-size-compact: 40px # Keeps grouped thousands and their affixes inside the minimum-width tile.

# Dedicated browser-local QR editor palette.
qr-studio:
  color:
    surface-page: "#141618"
    surface-panel: "#1B1D20"
    surface-control: "#25282B"
    surface-hover: "#303438"
    border-subtle: "#3D4043"
    text-primary: "#F3F4F0"
    text-muted: "#A5ABAE"
    accent-primary: "#D3F668"
    accent-ink: "#1B2407"
    status-good: "#BAE370"
    status-error: "#FA9784"
    status-warn: "#EDCA7F"
    paper-white: "#FFFFFF"
    ink-black: "#000000"
    guide-lock: "#D36930"
    lock-match: "#17803D"
    lock-conflict: "#DC2626"
    guide-structure: "#258BAD"
    guide-grid: "#232C341F"
    guide-cursor: "#A542E1"
    guide-expected: "#A0A0A0"
    primary-hover: "#E2FF91"
    shadow-soft: "#00000026"
    text-subdued: "#787E82"
    dialog-backdrop: "#000000A6"
    shadow-strong: "#0000004C"
    invalid-highlight: "#FA978452"
