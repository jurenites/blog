<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testing Component status dashboard · jurenites</title>
  <link rel="icon" type="image/svg+xml" sizes="16x16" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body class="status-dashboard">
  <main class="status-dashboard__main">
    <h1 class="visually-hidden">Visual testing</h1>
    <div class="status-dashboard__workspace">
    <aside class="status-dashboard__catalogue" aria-label="Component catalogue">

      <div class="status-dashboard__filters">
        <div class="status-dashboard__filter-field">
          <label class="text-input__label visually-hidden" for="component-search">Find a component</label>
          <input class="text-input__control" id="component-search" type="search" placeholder="Search components" autocomplete="off">
        </div>
        <div class="status-dashboard__status-chips" id="status-filter" role="group" aria-label="Filter components by status"></div>
      </div>
      <p id="report-errors" role="alert" hidden></p>
      <div id="component-catalogue"></div>
      <p id="empty-results" hidden>No components match these filters.</p>
      <p class="status-dashboard__summary" id="status-summary" role="status">Loading component catalogue…</p>
      <p class="status-dashboard__updated" id="updated-time"></p>
      <div class="status-dashboard__catalogue-tools"><span id="catalogue-count" role="status"></span></div>
    </aside>
    <div class="status-dashboard__review">
    <p id="selection-placeholder">Choose a component to compare Figma, Storybook and the website. Missing references stay visible.</p>
    <section class="status-dashboard__details" id="component-details" aria-labelledby="detail-heading" hidden tabindex="-1"></section>
    </div>
    </div>
    <details class="status-dashboard__pipeline" hidden>
      <summary>CI/CD &amp; diagnostics</summary>
      <div id="pipeline-results"><p>No pipeline reports have been imported.</p></div>
    </details>
    <footer class="status-dashboard__footer">Local review · settings save automatically<time class="status-dashboard__capture-time" id="capture-time" aria-label="Capture date" hidden></time></footer>
  </main>
</body>
</html>
