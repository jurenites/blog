# Dedicated HTTP virtual host. Add your trusted public IP before enabling access.
# Do not place these files inside a public document root.
server {
    listen 80;
    server_name test.jurenites.com;

    allow 127.0.0.1;
    # allow YOUR_TRUSTED_PUBLIC_IP;
    deny all;

    client_max_body_size 12m;
    location / {
        proxy_pass http://127.0.0.1:7779;
        proxy_set_header Host test.jurenites.com;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
