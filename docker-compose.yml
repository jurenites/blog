services:
  local_proxy:
    image: nginx:1.27-alpine
    container_name: blog_jurenites_local_proxy
    depends_on:
      - web
      - storybook
    ports:
      - "80:80"
    volumes:
      - ./docker/local-proxy.conf:/etc/nginx/conf.d/default.conf:ro

  web:
    build:
      context: .
    container_name: blog_jurenites_web
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "80"
    volumes:
      - .:/opt/drupal
    environment:
      DRUPAL_DATABASE_HOST: db
      DRUPAL_DATABASE_NAME: drupal
      DRUPAL_DATABASE_USER: drupal
      DRUPAL_DATABASE_PASSWORD: drupal

  db:
    image: mariadb:11.4
    container_name: blog_jurenites_db
    environment:
      MARIADB_DATABASE: drupal
      MARIADB_USER: drupal
      MARIADB_PASSWORD: drupal
      MARIADB_ROOT_PASSWORD: drupal_root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional local evaluation service. Start explicitly with `up -d clickhouse`.
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    platform: linux/arm64
    container_name: blog_jurenites_clickhouse
    profiles: [analytics]
    ports:
      - "127.0.0.1:8123:8123"
    env_file:
      - path: ./docker/clickhouse/.env.local
        required: false
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./docker/clickhouse/local-server.xml:/etc/clickhouse-server/config.d/local-server.xml:ro
      - ./docker/clickhouse/local-users.xml:/etc/clickhouse-server/users.d/local-users.xml:ro
    mem_limit: 2g
    cpus: 2.0
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  storybook:
    build:
      context: .
      dockerfile: docker/storybook.Dockerfile
    container_name: blog_jurenites_storybook
    working_dir: /app
    expose:
      - "6006"
    volumes:
      - .:/app
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/npm-cache
      STORYBOOK_DISABLE_TELEMETRY: "1"
    command: sh -c "git config --global --add safe.directory /app && npm install && npm run storybook"

volumes:
  db-data:
  clickhouse-data:
