name: 'Jurenites Article YouTube video'
description: 'Adds one direct YouTube URL field above the Article body.'
type: 'Content field'
install:
  - youtube
config:
  strict:
    - field.storage.node.field_youtube_video
  actions:
    core.entity_form_display.node.article.default:
      setComponents:
        - name: field_youtube_video
          options:
            type: youtube
            weight: 2
            region: content
            settings:
              placeholder_url: 'https://www.youtube.com/watch?v=VIDEO_ID'
            third_party_settings: {  }
        - name: body
          options:
            type: text_textarea_with_summary
            weight: 3
            region: content
            settings:
              rows: 9
              summary_rows: 3
              placeholder: ''
              show_summary: false
            third_party_settings: {  }
    core.entity_view_display.node.article.default:
      setComponent:
        name: field_youtube_video
        options:
          type: youtube_video
          label: hidden
          settings:
            youtube_size: responsive
            youtube_width: ''
            youtube_height: ''
            youtube_autoplay: false
            youtube_mute: false
            youtube_loop: false
            youtube_controls: false
            youtube_autohide: false
            youtube_iv_load_policy: false
          third_party_settings: {  }
          weight: -2
          region: content
