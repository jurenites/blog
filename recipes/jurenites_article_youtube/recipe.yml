name: 'Jurenites Article YouTube video'
description: 'Adds Article consumption time and a direct YouTube reference with managed creator, publication-date, avatar, and thumbnail metadata.'
type: 'Content field'
install:
  - datetime
  - link
  - youtube
config:
  strict:
    - field.storage.node.field_youtube_video
    - field.storage.node.field_consumption_time_minutes
    - field.storage.node.field_youtube_channel_avatar
    - field.storage.node.field_youtube_creator_name
    - field.storage.node.field_youtube_creator_url
    - field.storage.node.field_youtube_published_date
  actions:
    field.field.node.article.field_image:
      simpleConfigUpdate:
        settings.alt_field_required: false
    core.entity_form_display.node.article.default:
      setComponents:
        - name: field_youtube_video
          options:
            type: youtube
            weight: 2
            region: content
            settings:
              placeholder_url: 'https://www.youtube.com/watch?v=VIDEO_ID'
            third_party_settings: {  }
        - name: field_youtube_creator_name
          options:
            type: string_textfield
            weight: 3
            region: content
            settings:
              size: 60
              placeholder: 'YouTube creator or channel name'
            third_party_settings: {  }
        - name: field_youtube_creator_url
          options:
            type: link_default
            weight: 4
            region: content
            settings:
              placeholder_url: 'https://www.youtube.com/@channel'
              placeholder_title: ''
            third_party_settings: {  }
        - name: field_youtube_published_date
          options:
            type: datetime_default
            weight: 5
            region: content
            settings: {  }
            third_party_settings: {  }
        - name: field_youtube_channel_avatar
          options:
            type: string_textfield
            weight: 6
            region: content
            settings:
              size: 60
              placeholder: 'https://yt3.googleusercontent.com/...'
            third_party_settings: {  }
        - name: field_consumption_time_minutes
          options:
            type: number
            weight: 7
            region: content
            settings:
              placeholder: '5'
            third_party_settings: {  }
        - name: body
          options:
            type: text_textarea_with_summary
            weight: 8
            region: content
            settings:
              rows: 9
              summary_rows: 3
              placeholder: ''
              show_summary: false
            third_party_settings: {  }
    core.entity_view_display.node.article.default:
      setComponent:
        name: field_youtube_video
        options:
          type: youtube_video
          label: hidden
          settings:
            youtube_size: responsive
            youtube_width: ''
            youtube_height: ''
            youtube_autoplay: false
            youtube_mute: false
            youtube_loop: false
            youtube_controls: false
            youtube_autohide: false
            youtube_iv_load_policy: false
          third_party_settings: {  }
          weight: -2
          region: content
