name: 'Jurenites Paragraphs crossfade'
description: 'Adds Paragraphs content sections and the two-image crossfade to Articles and Basic pages.'
type: 'Content field'
recipes:
  - jurenites_media
install:
  - jurenites_crossfade
config:
  strict:
    - field.storage.node.field_content_sections
  import:
    jurenites_crossfade:
      - core.entity_form_display.paragraph.two_image_crossfade.default
      - core.entity_view_display.paragraph.two_image_crossfade.default
      - field.field.paragraph.two_image_crossfade.field_crossfade_images
      - field.storage.paragraph.field_crossfade_images
      - paragraphs.paragraphs_type.two_image_crossfade
  actions:
    core.entity_form_display.node.article.default: &content_sections_form_display
      setComponent:
        name: field_content_sections
        options:
          type: paragraphs
          weight: 4
          region: content
          settings:
            title: 'Content section'
            title_plural: 'Content sections'
            edit_mode: open
            closed_mode: summary
            autocollapse: none
            closed_mode_threshold: 0
            add_mode: dropdown
            form_display_mode: default
            default_paragraph_type: ''
            features:
              collapse_edit_all: collapse_edit_all
              duplicate: duplicate
          third_party_settings: {  }
    core.entity_form_display.node.page.default:
      <<: *content_sections_form_display
    core.entity_view_display.node.article.default: &content_sections_view_display
      setComponent:
        name: field_content_sections
        options:
          type: entity_reference_revisions_entity_view
          label: hidden
          settings:
            view_mode: default
            link: false
          third_party_settings: {  }
          weight: 10
          region: content
    core.entity_view_display.node.page.default:
      <<: *content_sections_view_display
